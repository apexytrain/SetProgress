name: SetProgress Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
           unzip -o SetProgress_6_207_Versionsnummern_vereinheitlicht.zip

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SET_PROGRESS_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/setprogress-release.keystore"

      - name: Build AAB
        env:
          SET_PROGRESS_KEYSTORE: ${{ runner.temp }}/setprogress-release.keystore
          SET_PROGRESS_KEYSTORE_PASSWORD: ${{ secrets.SET_PROGRESS_KEYSTORE_PASSWORD }}
          SET_PROGRESS_KEY_ALIAS: ${{ secrets.SET_PROGRESS_KEY_ALIAS }}
          SET_PROGRESS_KEY_PASSWORD: ${{ secrets.SET_PROGRESS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon ... assembleRelease bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SetProgress-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
