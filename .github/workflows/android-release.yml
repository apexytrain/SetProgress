name: Import SetProgress 6.307

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find release ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'SetProgress_6_307_GITHUB_RELEASE_BUILD_FIXED.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SetProgress 6.307 release ZIP not found"
            exit 1
          fi

          echo "Found release ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract release
        run: |
          rm -rf /tmp/setprogress307
          mkdir -p /tmp/setprogress307

          unzip -o "$ZIP" -d /tmp/setprogress307

          echo "Release extracted successfully."

      - name: Verify Android project
        run: |
          test -f /tmp/setprogress307/android/app/build.gradle
          test -f /tmp/setprogress307/android/app/src/main/assets/index.html

          echo "Android project found."

      - name: Verify release version
        run: |
          echo "Checking for 6.307..."

          if grep -R "6.307" /tmp/setprogress307/android/app/build.gradle \
              /tmp/setprogress307/android/app/src/main/assets/index.html \
              /tmp/setprogress307/android/app/src/main/assets/sw.js 2>/dev/null; then
            echo "6.307 found."
          else
            echo "ERROR: 6.307 was not found in release files."
            exit 1
          fi

      - name: Copy release files into repository
        run: |
          cp -a /tmp/setprogress307/. .

      - name: Remove imported ZIP
        run: |
          rm -f SetProgress_6_307_GITHUB_RELEASE_BUILD_FIXED.zip

      - name: Commit SetProgress 6.307
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Import SetProgress 6.307 release source" || echo "Nothing to commit"

          git push
