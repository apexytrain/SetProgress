name: SetProgress Android Build 6.307

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check release ZIP
        run: |
          ZIP="SetProgress_6_307_GITHUB_RELEASE_BUILD_FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          echo "Using release ZIP: $ZIP"

      - name: Extract Android project
        run: |
          rm -rf android
          unzip -o "SetProgress_6_307_GITHUB_RELEASE_BUILD_FIXED.zip"

      - name: Verify Android project
        run: |
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/index.html

          echo "Android project found."

      - name: Verify version
        run: |
          echo "Checking release version..."

          echo "build.gradle:"
          grep -n "versionName\|versionCode" android/app/build.gradle || true

          echo "index.html:"
          grep -n "app-version" android/app/src/main/assets/index.html || true

          if grep -q "6.307" android/app/build.gradle && \
             grep -q "6.307" android/app/src/main/assets/index.html; then
            echo "SUCCESS: Version 6.307 found."
          else
            echo "ERROR: Version 6.307 was not found."
            exit 1
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SET_PROGRESS_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/setprogress-release.jks"

      - name: Build AAB and APK
        env:
          SET_PROGRESS_KEYSTORE: ${{ runner.temp }}/setprogress-release.jks
          SET_PROGRESS_KEYSTORE_PASSWORD: ${{ secrets.SET_PROGRESS_KEYSTORE_PASSWORD }}
          SET_PROGRESS_KEY_ALIAS: ${{ secrets.SET_PROGRESS_KEY_ALIAS }}
          SET_PROGRESS_KEY_PASSWORD: ${{ secrets.SET_PROGRESS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon -p android assembleRelease bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SetProgress-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SetProgress-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
